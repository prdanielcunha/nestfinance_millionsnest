name: NestFinance Frontend Quality Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.*"
      - "tsconfig*.json"
      - ".github/workflows/nestfinance-frontend-quality.yml"
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.*"
      - "tsconfig*.json"
      - ".github/workflows/nestfinance-frontend-quality.yml"

jobs:
  frontend-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript lint and typecheck
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Verify brand assets
        run: npm run check:brand-assets

      - name: Verify public entrypoints
        run: npm run check:vercel-entrypoints
