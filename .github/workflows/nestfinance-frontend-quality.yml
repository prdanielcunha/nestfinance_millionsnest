jobs:
  frontend-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript lint and typecheck
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Verify native PDF text extractor I2F
        run: npm run test:universal-evidence-pdf-text-extractor-i2f

      - name: Verify human-safe infrastructure errors
        run: npx tsx scripts/test-human-safe-infra-errors.ts

      - name: Verify finance context localization
        run: npx tsx scripts/test-finance-context-bar-i18n.ts

      - name: Verify roadmap cycle 01 context gate
        run: npm run test:roadmap-cycle-01

      - name: Verify roadmap cycle 02 accessibility gate
        run: npm run test:roadmap-cycle-02

      - name: Verify roadmap cycle 03 guided Count journey
        run: npm run test:roadmap-cycle-03

      - name: Verify roadmap cycle 04 independent double Count
        run: npm run test:roadmap-cycle-04

      - name: Verify roadmap cycle 05 Count proposals
        run: npm run test:roadmap-cycle-05

      - name: Verify roadmap cycle 06 universal input
        run: npm run test:roadmap-cycle-06

      - name: Verify roadmap cycle 07 recorded voice capture
        run: npm run test:roadmap-cycle-07

      - name: Verify roadmap cycle 08 governed intelligence engine
        run: npm run test:roadmap-cycle-08

      - name: Verify roadmap cycle 09 operational close
        run: npm run test:roadmap-cycle-09

      - name: Verify roadmap cycle 10 accountant package and certification engineering
        run: npm run test:roadmap-cycle-10

      - name: Verify premium UX roadmap 2026-09-25
        run: npm run test:premium-roadmap-20260925

      - name: Verify guided transaction create flow
        run: npx tsx scripts/test-transaction-create-guided.ts

      - name: Verify Transaction Create has no posting side effects
        run: npx tsx scripts/test-transaction-create-no-posting.ts

      - name: Verify Transaction Review 2.0 queue
        run: npx tsx scripts/test-transaction-review-queue.ts

      - name: Verify Transaction Review Detail 2.0
        run: npx tsx scripts/test-transaction-review-detail.ts

      - name: Verify Review document context
        run: npm run test:transaction-review-evidence-context

      - name: Verify Review related history
        run: npm run test:transaction-review-related-history

      - name: Verify Transaction Detail 2.0 overview
        run: npx tsx scripts/test-transaction-detail-overview.ts

      - name: Verify Transaction Edit 2.0 guided flow
        run: npx tsx scripts/test-transaction-edit-guided.ts

      - name: Verify Count 2.0 H1/H2
        run: npx tsx scripts/test-count-pilot.ts

      - name: Verify Count Paper H3A
        run: npx tsx scripts/test-count-paper-h3a.ts

      - name: Verify Count Capture H3B1
        run: npx tsx scripts/test-count-capture-h3b1.ts

      - name: Verify Count Capture H3B2 geometry
        run: npx tsx scripts/test-count-capture-h3b2.ts

      - name: Verify Count Capture H3B3 extraction
        run: npx tsx scripts/test-count-capture-h3b3.ts

      - name: Verify Count Capture H3B4 denominations
        run: npx tsx scripts/test-count-capture-h3b4.ts

      - name: Verify brand assets
        run: npm run check:brand-assets

      - name: Verify public entrypoints
        run: npm run check:vercel-entrypoints
