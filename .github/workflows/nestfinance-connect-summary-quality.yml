name: NestFinance Connect Summary Quality
on:
  pull_request:
    paths:
      - api/system-gateway.ts
      - server/vercel-handlers/system/connectSupportDraft.ts
      - src/services/connectSupportAction.ts
      - src/components/finance/ConnectSupportButton.tsx
      - src/app/layouts/ShellLayout.tsx
      - scripts/test-connect-support-entry.ts
      - docs/connect/SUPPORT_ENTRY.md
      - api/finance-gateway.ts
      - server/vercel-handlers/finance/connectPendingDocuments.ts
      - server/vercel-handlers/finance/universalEvidenceList.ts
      - scripts/test-connect-pending-documents.ts
      - scripts/check-api-contracts.mjs
      - .github/workflows/nestfinance-connect-summary-quality.yml
      - .github/workflows/nestfinance-production-release.yml
      - scripts/check-connect-summary-release.mjs
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node scripts/check-connect-summary-release.mjs
      - run: node --import tsx scripts/test-connect-pending-documents.ts
      - run: node --import tsx scripts/test-connect-support-entry.ts
      - run: npm run check:api-contracts
      - run: npm run check:saas-isolation
      - run: npm run test:certification-gates
      - run: npm run lint
      - run: npm run build
      - run: npm run build:cloudrun
