name: I2F Temporary Lockfile Generator

on:
  pull_request:
    branches: [main]
    paths:
      - package.json
      - .github/workflows/i2f-lockfile-temp.yml

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: product/p1-universal-capture-inbox-i2f-native-pdf-text
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Generate package-lock only
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify unpdf is locked
        run: |
          node -e "const l=require('./package-lock.json'); const p=l.packages?.['node_modules/unpdf']; if (!p || p.version !== '1.8.1') process.exit(1); console.log(p.version, p.integrity)"
      - name: Commit generated lockfile
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package-lock.json
          if git diff --cached --quiet; then
            echo 'package-lock already current'
            exit 0
          fi
          git commit -m 'chore: lock unpdf dependency for I2F'
          git push origin HEAD:product/p1-universal-capture-inbox-i2f-native-pdf-text
