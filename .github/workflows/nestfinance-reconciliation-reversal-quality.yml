name: NestFinance Reconciliation Reversal Quality

on:
  pull_request:
    paths:
      - 'shared/finance/reconciliationConfirmation.ts'
      - 'shared/finance/reconciliationLineLock.ts'
      - 'shared/finance/reconciliationReversal.ts'
      - 'shared/finance/ledger/transaction.ts'
      - 'shared/intelligence/canonicalFact.ts'
      - 'server/vercel-handlers/finance/reconciliationConfirm.ts'
      - 'server/vercel-handlers/finance/reconciliationReverse.ts'
      - 'server/vercel-handlers/finance/reconciliationConfirmationIds.ts'
      - 'server/vercel-handlers/finance/transactionsDetail.ts'
      - 'server/vercel-handlers/finance/accessHelpers.ts'
      - 'src/pages/finance/transactions/TransactionReconciliationTraceCard.tsx'
      - 'src/pages/finance/transactions/TransactionDetailPage.tsx'
      - 'src/services/reconciliationService.ts'
      - 'api/finance-gateway.ts'
      - 'scripts/check-api-contracts.mjs'
      - 'scripts/test-reconciliation-confirm-emulator.ts'
      - 'scripts/test-reconciliation-confirmation-ui.ts'
      - 'scripts/test-reconciliation-reversal-emulator.ts'
      - 'scripts/test-reconciliation-reversal-firestore-rules.ts'
      - 'scripts/test-reconciliation-reversal-ui.ts'
      - 'scripts/test-intelligence-fact-foundation.ts'
      - 'firestore.rules'
      - '.github/workflows/nestfinance-reconciliation-reversal-quality.yml'
  push:
    branches:
      - 'architecture/p9e-*'
    paths:
      - 'shared/finance/reconciliationConfirmation.ts'
      - 'shared/finance/reconciliationLineLock.ts'
      - 'shared/finance/reconciliationReversal.ts'
      - 'shared/finance/ledger/transaction.ts'
      - 'shared/intelligence/canonicalFact.ts'
      - 'server/vercel-handlers/finance/reconciliationConfirm.ts'
      - 'server/vercel-handlers/finance/reconciliationReverse.ts'
      - 'server/vercel-handlers/finance/reconciliationConfirmationIds.ts'
      - 'server/vercel-handlers/finance/transactionsDetail.ts'
      - 'server/vercel-handlers/finance/accessHelpers.ts'
      - 'src/pages/finance/transactions/TransactionReconciliationTraceCard.tsx'
      - 'src/pages/finance/transactions/TransactionDetailPage.tsx'
      - 'src/services/reconciliationService.ts'
      - 'api/finance-gateway.ts'
      - 'scripts/check-api-contracts.mjs'
      - 'scripts/test-reconciliation-confirm-emulator.ts'
      - 'scripts/test-reconciliation-confirmation-ui.ts'
      - 'scripts/test-reconciliation-reversal-emulator.ts'
      - 'scripts/test-reconciliation-reversal-firestore-rules.ts'
      - 'scripts/test-reconciliation-reversal-ui.ts'
      - 'scripts/test-intelligence-fact-foundation.ts'
      - 'firestore.rules'
      - '.github/workflows/nestfinance-reconciliation-reversal-quality.yml'

jobs:
  reconciliation-reversal:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_ENV: test
      FIREBASE_PROJECT_ID: nestfinance-reconciliation-reversal-emulator
      GCLOUD_PROJECT: nestfinance-reconciliation-reversal-emulator
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run lint

      - name: Frontend build
        run: npm run build

      - name: Cloud Run bundle
        run: npm run build:cloudrun

      - name: Certified API contracts
        run: npm run check:api-contracts

      - name: Fact taxonomy
        run: npx tsx scripts/test-intelligence-fact-foundation.ts

      - name: Confirmation v2 + reversal UX and authority
        run: |
          npx tsx scripts/test-reconciliation-confirmation-ui.ts
          npx tsx scripts/test-reconciliation-reversal-ui.ts

      - name: Install emulator tools
        run: npm install firebase-tools@15.27.0 tsx@4.21.0 --no-save

      - name: Confirm reverse correct Firestore Emulator
        run: >
          npx firebase-tools emulators:exec --only firestore
          --project nestfinance-reconciliation-reversal-emulator
          "npx tsx scripts/test-reconciliation-confirm-emulator.ts && npx tsx scripts/test-reconciliation-reversal-emulator.ts"

      - name: Reconciliation browser Rules
        run: >
          npx firebase-tools emulators:exec --only firestore
          --project nestfinance-reconciliation-reversal-emulator
          "npx tsx scripts/test-reconciliation-confirm-firestore-rules.ts && npx tsx scripts/test-reconciliation-reversal-firestore-rules.ts"
