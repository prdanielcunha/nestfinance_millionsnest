name: Firebase Hosting Deploy

on:
  push:
    branches: [ production ]
    paths:
      - ".github/workflows/firebase-hosting-deploy.yml"
      - "src/**"
      - "components/**"
      - "services/**"
      - "lib/**"
      - "App.tsx"
      - "main.tsx"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.*"
      - "firebase.json"
      - ".firebaserc"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: nestfinance-firebase-hosting-production
  cancel-in-progress: false

env:
  PROJECT_ID: millionsnest
  SITE_ID: mn-nestfinance-555464791734

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact production commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Authenticate with MillionsNest production WIF
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/555464791734/locations/global/workloadIdentityPools/mn-prod-github/providers/github
          service_account: mn-web-deployer@millionsnest.iam.gserviceaccount.com

      - name: Install dependencies
        run: npm ci

      - name: Validate frontend and Firebase contract
        run: |
          npm run lint
          npm run test:firebase-infra
          npm run build

      - name: Deploy NestFinance Firebase Hosting
        run: npx firebase-tools@15.27.0 deploy --only hosting:nestfinance --project "$PROJECT_ID" --non-interactive

      - name: Smoke test Firebase Hosting
        shell: bash
        run: |
          set -euo pipefail
          URL="https://${SITE_ID}.web.app"
          for i in {1..20}; do
            STATUS="$(curl --silent --show-error --location --output /tmp/nf-home.html --write-out '%{http_code}' "$URL/" || true)"
            if [ "$STATUS" = "200" ] && grep -Eiq '<!doctype html|<html' /tmp/nf-home.html; then
              echo "NESTFINANCE_FIREBASE_HOSTING_SMOKE_OK=$URL"
              exit 0
            fi
            echo "Attempt $i: status=$STATUS"
            sleep 3
          done
          echo "NestFinance Hosting smoke failed"
          cat /tmp/nf-home.html || true
          exit 1
