name: NestFinance Certified Book Quality
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'shared/finance/ledger/**'
      - 'server/vercel-handlers/finance/certified*.ts'
      - 'server/vercel-handlers/finance/loadPostingConfiguration.ts'
      - 'server/vercel-handlers/finance/transactionsApproveForPosting.ts'
      - 'scripts/test-certified-book*.ts'
      - '.github/workflows/nestfinance-certified-book-quality.yml'
jobs:
  certified-book:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      FIREBASE_PROJECT_ID: demo-certified-book
      GCLOUD_PROJECT: demo-certified-book
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: node --import tsx scripts/test-certified-book.ts
      - run: node --import tsx scripts/test-posting-plan.ts
      - run: node --import tsx scripts/test-journal-integrity-e02.ts
      - run: npm run build
      - run: npm run build:cloudrun
      - run: npm install firebase-tools@15.27.0 --no-save --no-package-lock
      - name: Real isolated Firestore persistence, concurrency and rollback
        run: npx firebase-tools emulators:exec --only firestore --project demo-certified-book "node --import tsx scripts/test-certified-book-emulator.ts"
