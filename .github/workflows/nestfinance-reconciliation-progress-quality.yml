name: NestFinance Reconciliation Progress Quality

on:
  pull_request:
    paths:
      - 'shared/finance/reconciliationProgress.ts'
      - 'shared/finance/reconciliationProgressBuilder.ts'
      - 'server/vercel-handlers/finance/reconciliationProgress.ts'
      - 'src/pages/finance/balance/ReconciliationProgressPanel.tsx'
      - 'src/pages/finance/balance/ReconciliationStatementPreparationPanel.tsx'
      - 'src/services/reconciliationService.ts'
      - 'api/finance-gateway.ts'
      - 'scripts/check-api-contracts.mjs'
      - 'scripts/test-reconciliation-progress-builder.ts'
      - 'scripts/test-reconciliation-progress-emulator.ts'
      - 'scripts/test-reconciliation-progress-ui.ts'
      - '.github/workflows/nestfinance-reconciliation-progress-quality.yml'
  push:
    branches:
      - 'architecture/p9f-*'
    paths:
      - 'shared/finance/reconciliationProgress.ts'
      - 'shared/finance/reconciliationProgressBuilder.ts'
      - 'server/vercel-handlers/finance/reconciliationProgress.ts'
      - 'src/pages/finance/balance/ReconciliationProgressPanel.tsx'
      - 'src/pages/finance/balance/ReconciliationStatementPreparationPanel.tsx'
      - 'src/services/reconciliationService.ts'
      - 'api/finance-gateway.ts'
      - 'scripts/check-api-contracts.mjs'
      - 'scripts/test-reconciliation-progress-builder.ts'
      - 'scripts/test-reconciliation-progress-emulator.ts'
      - 'scripts/test-reconciliation-progress-ui.ts'
      - '.github/workflows/nestfinance-reconciliation-progress-quality.yml'

jobs:
  reconciliation-progress:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_ENV: test
      FIREBASE_PROJECT_ID: nestfinance-reconciliation-progress-emulator
      GCLOUD_PROJECT: nestfinance-reconciliation-progress-emulator
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run lint

      - name: Frontend build
        run: npm run build

      - name: Cloud Run bundle
        run: npm run build:cloudrun

      - name: Certified API contracts
        run: npm run check:api-contracts

      - name: Conservative progress builder
        run: npx tsx scripts/test-reconciliation-progress-builder.ts

      - name: Plain-language progress UX and authority
        run: npx tsx scripts/test-reconciliation-progress-ui.ts

      - name: Install emulator tools
        run: npm install firebase-tools@15.27.0 tsx@4.21.0 --no-save

      - name: Reconciliation progress Firestore Emulator
        run: >
          npx firebase-tools emulators:exec --only firestore
          --project nestfinance-reconciliation-progress-emulator
          "npx tsx scripts/test-reconciliation-progress-emulator.ts"
