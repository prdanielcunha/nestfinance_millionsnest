name: NestFinance Production Functional Gate
on:
  push:
    branches: [production]
  pull_request:
    branches: [production]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: nestfinance-functional-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: TypeScript contract
        run: npm run lint
      - name: SaaS tenant isolation
        run: npm run check:saas-isolation
      - name: Hub authentication and direct entry
        run: npm run test:cross-app-final-certification
      - name: Finance role permissions
        run: npm run test:finance-role-policy
      - name: Role-aware workspace
        run: npm run test:role-workspace
      - name: Count session discard and data integrity
        run: npm run test:count-session-discard
      - name: Immutable transaction removal rules
        run: npm run test:transaction-permanent-removal
      - name: Financial audit facts
        run: npm run test:audit-fact-projection
      - name: Universal evidence capture
        run: npm run test:universal-capture-i1
      - name: Cross-app finance signals
        run: npm run test:finance-cross-app-events
      - name: Reports and certification gates
        run: npm run test:certification-gates
      - name: Production build
        run: npm run build
