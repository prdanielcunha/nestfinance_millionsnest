name: NestFinance Audit Read Model Quality

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "api/finance-gateway.ts"
      - "server/vercel-handlers/finance/auditList.ts"
      - "shared/finance/auditReadModel.ts"
      - "src/pages/finance/AuditPage.tsx"
      - "src/services/auditService.ts"
      - "scripts/test-audit-read-model.ts"
      - "scripts/test-audit-read-model-emulator.ts"
      - "scripts/check-api-contracts.mjs"
      - "firestore.indexes.json"
      - ".github/workflows/nestfinance-audit-quality.yml"

jobs:
  audit-read-model:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      FIREBASE_PROJECT_ID: nestfinance-audit-read-model-emulator
      GCLOUD_PROJECT: nestfinance-audit-read-model-emulator

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Frontend build
        run: npm run build

      - name: Cloud Run bundle
        run: npm run build:cloudrun

      - name: Certified API contracts
        run: npm run check:api-contracts

      - name: Audit authority and UX
        run: npx tsx scripts/test-audit-read-model.ts

      - name: Install emulator tools
        run: npm install firebase-tools@15.27.0 tsx@4.21.0 --no-save

      - name: Audit Firestore Emulator
        run: npx firebase-tools emulators:exec --only firestore --project nestfinance-audit-read-model-emulator "npx tsx scripts/test-audit-read-model-emulator.ts"
