name: NestFinance Production Release

on:
  pull_request:
    branches: [ production ]
    types: [ closed ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: nestfinance-production-release
  cancel-in-progress: false

env:
  CONNECT_SUMMARY_API_ONLY: ${{ contains(github.event.pull_request.title, '[connect-summary-api-only]') }}
  CONNECT_SOURCE_RECOVERY_ONLY: ${{ contains(github.event.pull_request.title, '[connect-source-recovery-only]') }}
  PROJECT_ID: millionsnest
  REGION: us-central1
  SERVICE: nestfinance-api
  SITE_ID: mn-nestfinance-555464791734
  CANONICAL_BASE: https://nestfinance.millionsnest.com
  IMAGE: us-central1-docker.pkg.dev/millionsnest/millionsnest-web/nestfinance-api:${{ github.sha }}

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact production commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Guard scoped Connect API source
        if: env.CONNECT_SUMMARY_API_ONLY == 'true'
        run: node scripts/check-connect-summary-release.mjs

      - name: Guard reviewed source recovery API release
        if: env.CONNECT_SOURCE_RECOVERY_ONLY == 'true'
        run: node scripts/check-connect-source-recovery-release.mjs

      - name: Authenticate with MillionsNest production WIF
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/555464791734/locations/global/workloadIdentityPools/mn-prod-github/providers/github
          service_account: mn-web-deployer@millionsnest.iam.gserviceaccount.com

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Certify exact production commit
        run: |
          set -euo pipefail
          node --import tsx scripts/test-connect-pending-documents.ts
          node --import tsx scripts/test-connect-read-entry.ts
          node --import tsx scripts/test-finance-request-context.ts
          node --import tsx scripts/test-handoff-token-binding.ts
          node --import tsx scripts/test-universal-evidence-inbox-i2a.ts
          npm run lint
          npm run check:api-contracts
          npm run test:count-session-discard
          npm run check:saas-isolation
          npm run test:auth-session
          npm run test:role-workspace
          npm run test:finance-role-policy
          npm run test:ecosystem-overview
          npm run test:finance-hub-read-model
          npm run test:finance-cross-app-events
          npm run test:audit-fact-projection
          npm run test:audit-live-emission
          npm run test:personalized-workspaces
          npm run test:adaptive-navigation
          npm run test:command-palette
          npm run test:premium-roadmap-20260925
          npm run test:transaction-permanent-removal
          npm run test:transaction-create-no-posting
          npm run test:transaction-inspector
          npm run test:transaction-saved-views
          npm run test:transaction-combined-filters
          npm run test:transaction-universal-search
          npm run test:transaction-review-evidence-context
          npm run test:transaction-review-related-history
          npm run test:cross-app-final-certification
          npm run test:firebase-infra
          npm run test:certification-gates
          npm run build
          npm run build:cloudrun

      - name: Configure Docker authentication
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build exact Cloud Run image
        run: docker build -t "$IMAGE" .

      - name: Local container smoke
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --rm --name nf-release-smoke             -e PORT=8080             -e NODE_ENV=production             -e NESTFINANCE_SESSION_RESOLVE_ENABLED=true             -e NESTFINANCE_HANDOFF_REDEEM_ENABLED=true             -e NESTFINANCE_RELEASE_SHA="$GITHUB_SHA"             -p 18081:8080 "$IMAGE"
          trap 'docker stop nf-release-smoke >/dev/null 2>&1 || true' EXIT

          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18081/healthz >/dev/null; then
              break
            fi
            if [ "$i" = "30" ]; then
              docker logs nf-release-smoke
              exit 1
            fi
            sleep 1
          done

          curl --fail --silent http://127.0.0.1:18081/api/system/release -o /tmp/local-release.json
          node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/local-release.json','utf8'));const expected=process.env.GITHUB_SHA.slice(0,12);if(x.app!=='nestfinance'||x.gitCommitSha!==expected) { console.error(x, expected); process.exit(1); }"

          STATUS="$(curl --silent --output /tmp/local-gateway.json --write-out '%{http_code}'             -X POST 'http://127.0.0.1:18081/api/finance-gateway?operation=transactions-summary'             -H 'content-type: application/json'             --data '{"financeEntityId":"release-smoke"}')"
          test "$STATUS" = "401"

          AUTH_STATUS="$(curl --silent --output /tmp/local-auth.json --write-out '%{http_code}'             -X POST 'http://127.0.0.1:18081/api/auth/session/resolve')"
          if [ "$AUTH_STATUS" != "401" ]; then
            echo "Expected enabled session resolver to reject missing auth with 401, got $AUTH_STATUS"
            cat /tmp/local-auth.json || true
            exit 1
          fi

          HANDOFF_STATUS="$(curl --silent --output /tmp/local-handoff.json --write-out '%{http_code}'             -X POST 'http://127.0.0.1:18081/api/auth/handoff/redeem'             -H 'content-type: application/json'             --data '{"code":"invalid"}')"
          if [ "$HANDOFF_STATUS" != "400" ]; then
            echo "Expected enabled handoff redeem to reject invalid code with 400, got $HANDOFF_STATUS"
            cat /tmp/local-handoff.json || true
            exit 1
          fi

          DIRECT_STATUS="$(curl --silent --output /tmp/local-direct-entry.json --write-out '%{http_code}'             -X POST 'http://127.0.0.1:18081/api/auth/direct-entry'             -H 'content-type: application/json'             --data '{}')"
          if [ "$DIRECT_STATUS" != "401" ]; then
            echo "Expected direct entry to require Firebase identity with 401, got $DIRECT_STATUS"
            cat /tmp/local-direct-entry.json || true
            exit 1
          fi

          ENTITY_SELECTOR_STATUS="$(curl --silent --output /tmp/local-entity-selector.json --write-out '%{http_code}'             -X POST 'http://127.0.0.1:18081/api/finance/entities/accessible'             -H 'content-type: application/json'             --data '{}')"
          if [ "$ENTITY_SELECTOR_STATUS" != "401" ]; then
            echo "Expected accessible entity selector to require authentication with 401, got $ENTITY_SELECTOR_STATUS"
            cat /tmp/local-entity-selector.json || true
            exit 1
          fi

          ECOSYSTEM_STATUS="$(curl --silent --output /tmp/local-ecosystem-overview.json --write-out '%{http_code}'             -X POST 'http://127.0.0.1:18081/api/finance/ecosystem/overview'             -H 'content-type: application/json'             --data '{}')"
          if [ "$ECOSYSTEM_STATUS" != "401" ]; then
            echo "Expected ecosystem overview to require authentication with 401, got $ECOSYSTEM_STATUS"
            cat /tmp/local-ecosystem-overview.json || true
            exit 1
          fi

          HUB_READ_MODEL_STATUS="$(curl --silent --output /tmp/local-finance-hub-read-model.json --write-out '%{http_code}'             -X POST 'http://127.0.0.1:18081/api/finance/intelligence/read-model'             -H 'content-type: application/json'             --data '{"financeEntityId":"release-smoke","period":"2026-09"}')"
          if [ "$HUB_READ_MODEL_STATUS" != "401" ]; then
            echo "Expected finance Hub read model to require authentication with 401, got $HUB_READ_MODEL_STATUS"
            cat /tmp/local-finance-hub-read-model.json || true
            exit 1
          fi

          echo "NESTFINANCE_LOCAL_RELEASE_SMOKE_OK"

      - name: Capture reversible production release baseline (all paths)
        # Preserve the current 100% serving revision and Hosting release before
        # any mutation; required even for the ordinary full release path.
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json > /tmp/finance-before.json
          jq -e '.status.traffic | map(select(.percent == 100 and .revisionName != null)) | length == 1' /tmp/finance-before.json >/dev/null
          PREVIOUS="$(jq -r '.status.traffic[] | select(.percent == 100) | .revisionName' /tmp/finance-before.json)"
          echo "PREVIOUS_FINANCE_REVISION=$PREVIOUS" >> "$GITHUB_ENV"
          TAG_TARGETS="$(jq -r '[.status.traffic[] | select(.tag != null and .revisionName != null) | (.tag+"="+.revisionName)] | sort | join(",")' /tmp/finance-before.json)"
          if [ -n "$TAG_TARGETS" ]; then [[ "$TAG_TARGETS" =~ ^[a-z0-9-]+=[a-z0-9-]+(,[a-z0-9-]+=[a-z0-9-]+)*$ ]]; fi
          echo "PREVIOUS_FINANCE_TAG_TARGETS=$TAG_TARGETS" >> "$GITHUB_ENV"
          jq -S '{runtime:(.spec.template.spec | .containers[0] |= (del(.image) | .env = ((.env // []) | map(select(.name != "NESTFINANCE_RELEASE_SHA")) | sort_by(.name)))),serviceLabels:.metadata.labels,templateLabels:.spec.template.metadata.labels,serviceAnnotations:(.metadata.annotations | del(.["run.googleapis.com/operation-id"],.["run.googleapis.com/urls"],.["run.googleapis.com/client-name"],.["run.googleapis.com/client-version"],.["serving.knative.dev/creator"],.["serving.knative.dev/lastModifier"])),templateAnnotations:(.spec.template.metadata.annotations | del(.["client.knative.dev/user-image"],.["run.googleapis.com/client-name"],.["run.googleapis.com/client-version"],.["run.googleapis.com/operation-id"]))}' /tmp/finance-before.json > /tmp/finance-config-before.json
          gcloud run services get-iam-policy "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json | jq -S . > /tmp/finance-iam-before.json
          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          echo "::add-mask::$ACCESS_TOKEN"
          curl --fail --silent --show-error --max-time 30 -H "Authorization: Bearer $ACCESS_TOKEN"             'https://firebasehosting.googleapis.com/v1beta1/sites/mn-nestfinance-555464791734/releases?pageSize=1' > /tmp/finance-hosting-before.json
          VERSION="$(jq -er '.releases[0].version.name' /tmp/finance-hosting-before.json)"
          [[ "$VERSION" =~ ^sites/mn-nestfinance-555464791734/versions/[a-zA-Z0-9_-]+$ ]]
          echo "PREVIOUS_FINANCE_HOSTING_VERSION=$VERSION" >> "$GITHUB_ENV"

      # Shared project millionsnest: Firestore rules/indexes are centrally owned by
      # prdanielcunha/millionsnest. Deploying repo-local subsets here replaces
      # cross-app authorization/indexes; never mutate shared policies from Finance.
      - name: Verify canonical Hub shared Firestore Rules (read-only, fail-closed)
        shell: bash
        run: |
          set -euo pipefail
          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          echo "::add-mask::$ACCESS_TOKEN"
          curl --fail --silent --show-error --max-time 20 \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            "https://firebaserules.googleapis.com/v1/projects/millionsnest/releases/cloud.firestore" \
            -o /tmp/finance-shared-rules-release.json
          RULESET_NAME="$(jq -er '.rulesetName' /tmp/finance-shared-rules-release.json)"
          [[ "$RULESET_NAME" =~ ^projects/millionsnest/rulesets/[a-zA-Z0-9-]+$ ]]
          curl --fail --silent --show-error --max-time 20 \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            "https://firebaserules.googleapis.com/v1/$RULESET_NAME" \
            -o /tmp/finance-shared-rules-source.json
          node - <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const files = JSON.parse(fs.readFileSync('/tmp/finance-shared-rules-source.json','utf8')).source?.files;
          if (!Array.isArray(files) || files.length !== 1 || files[0].name !== 'firestore.rules' || typeof files[0].content !== 'string') {
            console.error('NESTFINANCE_SHARED_FIRESTORE_SOURCE_INVALID');
            process.exit(1);
          }
          const liveSha = crypto.createHash('sha256').update(files[0].content).digest('hex');
          // Hub production b3fe22b / canonical authority publication run 39239780589.
          // Membership and root identity authority are server-protected; gateway storage remains closed.
          const approvedHubSha = 'f8e53e531169fb658fce646fb7abd241a286af2e343b3a446a8d33f1a17709a9';
          if (liveSha !== approvedHubSha) {
            console.error('NESTFINANCE_SHARED_FIRESTORE_HUB_POLICY_DRIFT');
            process.exit(1);
          }
          console.log('NESTFINANCE_HUB_CANONICAL_FIRESTORE_READONLY_OK');
          NODE
          unset ACCESS_TOKEN


      - name: Push Cloud Run image
        run: docker push "$IMAGE"

      - name: Deploy Cloud Run revision preserving existing configuration
        shell: bash
        run: |
          set -euo pipefail
          DIGEST="$(gcloud artifacts docker images describe "$IMAGE" --project "$PROJECT_ID" --format='value(image_summary.digest)')"
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "EXPECTED_FINANCE_IMAGE_DIGEST=$DIGEST" >> "$GITHUB_ENV"
          set -euo pipefail
          echo "EXPECTED_FINANCE_REVISION=${SERVICE}-cg${GITHUB_RUN_ID}a${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          if [ -n "$PREVIOUS_FINANCE_TAG_TARGETS" ]; then
            gcloud run services update-traffic "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --update-tags="$PREVIOUS_FINANCE_TAG_TARGETS" --quiet
          fi
          gcloud run services update "$SERVICE" --project "$PROJECT_ID" --region "$REGION" \
            --image "$IMAGE" --update-env-vars "NESTFINANCE_RELEASE_SHA=$GITHUB_SHA" --revision-suffix "cg${GITHUB_RUN_ID}a${GITHUB_RUN_ATTEMPT}" --no-traffic --quiet
          gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json > /tmp/finance-after.json
          jq -S '{runtime:(.spec.template.spec | .containers[0] |= (del(.image) | .env = ((.env // []) | map(select(.name != "NESTFINANCE_RELEASE_SHA")) | sort_by(.name)))),serviceLabels:.metadata.labels,templateLabels:.spec.template.metadata.labels,serviceAnnotations:(.metadata.annotations | del(.["run.googleapis.com/operation-id"],.["run.googleapis.com/urls"],.["run.googleapis.com/client-name"],.["run.googleapis.com/client-version"],.["serving.knative.dev/creator"],.["serving.knative.dev/lastModifier"])),templateAnnotations:(.spec.template.metadata.annotations | del(.["client.knative.dev/user-image"],.["run.googleapis.com/client-name"],.["run.googleapis.com/client-version"],.["run.googleapis.com/operation-id"]))}' /tmp/finance-after.json > /tmp/finance-config-after.json
          if ! cmp --silent /tmp/finance-config-before.json /tmp/finance-config-after.json; then
            node --input-type=module -e "import fs from 'node:fs';const a=JSON.parse(fs.readFileSync('/tmp/finance-config-before.json')),b=JSON.parse(fs.readFileSync('/tmp/finance-config-after.json'));const changed=[];function walk(x,y,p=''){if(JSON.stringify(x)===JSON.stringify(y))return;if(x&&y&&typeof x==='object'&&typeof y==='object'){for(const k of new Set([...Object.keys(x),...Object.keys(y)]))walk(x[k],y[k],p+'.'+k);}else changed.push(p);}walk(a,b);console.log('FINANCE_CONFIG_DIFFERENT_PATHS='+JSON.stringify(changed.slice(0,50)))"
            exit 1
          fi
          gcloud run services get-iam-policy "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json | jq -S . > /tmp/finance-iam-after.json
          cmp --silent /tmp/finance-iam-before.json /tmp/finance-iam-after.json || { echo FINANCE_IAM_CHANGED; exit 1; }
          AFTER_TAG_TARGETS="$(jq -r '[.status.traffic[] | select(.tag != null and .revisionName != null) | (.tag+"="+.revisionName)] | sort | join(",")' /tmp/finance-after.json)"
          test "$AFTER_TAG_TARGETS" = "$PREVIOUS_FINANCE_TAG_TARGETS" || { echo FINANCE_PIN_TAG_MAPPING_CHANGED; exit 1; }
          echo FINANCE_RUNTIME_CONFIGURATION_AND_IAM_UNCHANGED

      - name: Verify exact image digest and route traffic
        shell: bash
        run: |
          set -euo pipefail
          gcloud run revisions describe "$EXPECTED_FINANCE_REVISION" --project "$PROJECT_ID" --region "$REGION" --format=json > /tmp/finance-revision.json
          node --input-type=module -e "import fs from 'node:fs';const r=JSON.parse(fs.readFileSync('/tmp/finance-revision.json'));if(r.metadata.name!==process.env.EXPECTED_FINANCE_REVISION||!r.status.imageDigest?.endsWith(process.env.EXPECTED_FINANCE_IMAGE_DIGEST)||!r.status.conditions?.some(x=>x.type==='Ready'&&x.status==='True'))process.exit(1)"
          gcloud run services update-traffic "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --to-revisions="$EXPECTED_FINANCE_REVISION=100" --quiet
          echo "FINANCE_CONNECT_EXACT_IMAGE_RELEASE_SHA=$GITHUB_SHA"

      - name: Verify exact live SHA after traffic convergence (no stale-200 approval)
        shell: bash
        run: |
          set -euo pipefail
          URL="$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')"
          READY="$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.conditions[0].status)')"
          test "$READY" = "True"
          MATCHED=false
          for ATTEMPT in {1..40}; do
            if curl --fail --silent --show-error --max-time 15 --location \
              -H 'Cache-Control: no-store, no-cache' \
              "$URL/api/system/release?release=$GITHUB_SHA&attempt=$ATTEMPT" -o /tmp/cloudrun-release.json; then
              if node - <<'NODE'
          const fs = require('fs');
          const x = JSON.parse(fs.readFileSync('/tmp/cloudrun-release.json','utf8'));
          if(x.app!=='nestfinance'||x.gitCommitSha!==process.env.GITHUB_SHA.slice(0,12))process.exit(1);
          NODE
              then
                MATCHED=true
                echo "NESTFINANCE_CLOUD_RUN_EXACT_SHA_OK=${GITHUB_SHA:0:12}"
                break
              fi
            fi
            sleep 3
          done
          test "$MATCHED" = "true"

      - name: Deploy Firebase Hosting
        run: |
          echo "FINANCE_HOSTING_RELEASE_STARTED=true" >> "$GITHUB_ENV"
          npx firebase-tools@15.27.0 deploy --only hosting:nestfinance --project "$PROJECT_ID" --non-interactive

      - name: Smoke production through Firebase Hosting
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://${SITE_ID}.web.app"

          for PATHNAME in "/" "/finance" "/finance/balance" "/finance/audit"; do
            curl --fail --silent --show-error --location --retry 6 --retry-delay 2 "$BASE$PATHNAME" -o /tmp/nf-page.html
            grep -Eiq '<!doctype html|<html' /tmp/nf-page.html
          done

          EXPECTED_SHA="${GITHUB_SHA:0:12}"
          for ATTEMPT in {1..20}; do
            curl --fail --silent --show-error --location "$BASE/api/system/release" -o /tmp/nf-release.json || true
            if node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/nf-release.json','utf8'));const expected=process.env.GITHUB_SHA.slice(0,12);process.exit(x.app==='nestfinance'&&x.gitCommitSha===expected?0:1)"; then
              echo "NESTFINANCE_FIREBASE_EXACT_SHA_OK $EXPECTED_SHA"
              break
            fi
            if [ "$ATTEMPT" = "20" ]; then
              echo "Firebase Hosting did not expose the expected release SHA in time."
              cat /tmp/nf-release.json || true
              exit 1
            fi
            sleep 3
          done

          STATUS="$(curl --silent --show-error --location --output /tmp/nf-gateway.json --write-out '%{http_code}'             -X POST "$BASE/api/finance-gateway?operation=transactions-summary"             -H 'content-type: application/json'             --data '{"financeEntityId":"release-smoke"}')"
          if [ "$STATUS" != "401" ]; then
            echo "Expected authenticated gateway to answer 401, got $STATUS"
            cat /tmp/nf-gateway.json || true
            exit 1
          fi

          AUTH_STATUS="$(curl --silent --show-error --location --output /tmp/nf-auth.json --write-out '%{http_code}'             -X POST "$BASE/api/auth/session/resolve")"
          if [ "$AUTH_STATUS" != "401" ]; then
            echo "Expected enabled session resolver to reject missing auth with 401, got $AUTH_STATUS"
            cat /tmp/nf-auth.json || true
            exit 1
          fi

          HANDOFF_STATUS="$(curl --silent --show-error --location --output /tmp/nf-handoff.json --write-out '%{http_code}'             -X POST "$BASE/api/auth/handoff/redeem"             -H 'content-type: application/json'             --data '{"code":"invalid"}')"
          if [ "$HANDOFF_STATUS" != "400" ]; then
            echo "Expected enabled handoff redeem to reject invalid code with 400, got $HANDOFF_STATUS"
            cat /tmp/nf-handoff.json || true
            exit 1
          fi

          DIRECT_STATUS="$(curl --silent --show-error --location --output /tmp/nf-direct-entry.json --write-out '%{http_code}'             -X POST "$BASE/api/auth/direct-entry"             -H 'content-type: application/json'             --data '{}')"
          if [ "$DIRECT_STATUS" != "401" ]; then
            echo "Expected direct entry to require Firebase identity with 401, got $DIRECT_STATUS"
            cat /tmp/nf-direct-entry.json || true
            exit 1
          fi

          ENTITY_SELECTOR_STATUS="$(curl --silent --show-error --location --output /tmp/nf-entity-selector.json --write-out '%{http_code}'             -X POST "$BASE/api/finance/entities/accessible"             -H 'content-type: application/json'             --data '{}')"
          if [ "$ENTITY_SELECTOR_STATUS" != "401" ]; then
            echo "Expected accessible entity selector to require authentication with 401, got $ENTITY_SELECTOR_STATUS"
            cat /tmp/nf-entity-selector.json || true
            exit 1
          fi

          ECOSYSTEM_STATUS="$(curl --silent --show-error --location --output /tmp/nf-ecosystem-overview.json --write-out '%{http_code}'             -X POST "$BASE/api/finance/ecosystem/overview"             -H 'content-type: application/json'             --data '{}')"
          if [ "$ECOSYSTEM_STATUS" != "401" ]; then
            echo "Expected ecosystem overview to require authentication with 401, got $ECOSYSTEM_STATUS"
            cat /tmp/nf-ecosystem-overview.json || true
            exit 1
          fi

          HUB_READ_MODEL_STATUS="$(curl --silent --show-error --location --output /tmp/nf-finance-hub-read-model.json --write-out '%{http_code}'             -X POST "$BASE/api/finance/intelligence/read-model"             -H 'content-type: application/json'             --data '{"financeEntityId":"release-smoke","period":"2026-09"}')"
          if [ "$HUB_READ_MODEL_STATUS" != "401" ]; then
            echo "Expected finance Hub read model to require authentication with 401, got $HUB_READ_MODEL_STATUS"
            cat /tmp/nf-finance-hub-read-model.json || true
            exit 1
          fi

          echo "NESTFINANCE_PRODUCTION_RELEASE_OK=$BASE"


      - name: Smoke canonical production domain
        shell: bash
        run: |
          set -euo pipefail
          BASE="$CANONICAL_BASE"

          for PATHNAME in "/" "/finance" "/finance/review"; do
            curl --fail --silent --show-error --location --retry 8 --retry-delay 3 "$BASE$PATHNAME" -o /tmp/nf-canonical-page.html
            grep -Eiq '<!doctype html|<html' /tmp/nf-canonical-page.html
          done

          EXPECTED_SHA="${GITHUB_SHA:0:12}"
          for ATTEMPT in {1..20}; do
            curl --fail --silent --show-error --location "$BASE/api/system/release" -o /tmp/nf-canonical-release.json || true
            if node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/nf-canonical-release.json','utf8'));const expected=process.env.GITHUB_SHA.slice(0,12);process.exit(x.app==='nestfinance'&&x.gitCommitSha===expected?0:1)"; then
              echo "NESTFINANCE_CANONICAL_EXACT_SHA_OK $EXPECTED_SHA"
              break
            fi
            if [ "$ATTEMPT" = "20" ]; then
              echo "Canonical production domain did not expose the expected release SHA in time."
              cat /tmp/nf-canonical-release.json || true
              exit 1
            fi
            sleep 3
          done

          STATUS="$(curl --silent --show-error --location --output /tmp/nf-canonical-gateway.json --write-out '%{http_code}'             -X POST "$BASE/api/finance-gateway?operation=transactions-summary"             -H 'content-type: application/json'             --data '{"financeEntityId":"release-smoke"}')"
          if [ "$STATUS" != "401" ]; then
            echo "Expected canonical authenticated gateway to answer 401, got $STATUS"
            cat /tmp/nf-canonical-gateway.json || true
            exit 1
          fi

          SUMMARY_STATUS="$(curl --silent --show-error --max-time 30 -o /tmp/nf-connect-summary.json -w '%{http_code}' -X POST "$BASE/api/finance-gateway?operation=connect-pending-documents" -H 'Content-Type: application/json' --data '{"financeEntityId":"release-smoke"}')"
          ENTITIES_STATUS="$(curl --silent --show-error --max-time 30 -o /tmp/nf-connect-entities.json -w '%{http_code}' -X POST "$BASE/api/finance-gateway?operation=connect-entities" -H 'Content-Type: application/json' --data '{}')"
          test "$ENTITIES_STATUS" = 401
          echo NESTFINANCE_CONNECT_ENTITIES_AUTHORITY_OK
          test "$SUMMARY_STATUS" = '401'
          echo NESTFINANCE_CONNECT_SUMMARY_AUTHORITY_OK
          SUPPORT_STATUS="$(curl --silent --show-error --max-time 30 --output /tmp/finance-support-auth.json --write-out '%{http_code}' -X POST "$BASE/api/system-gateway?operation=connect-support-draft" -H 'Content-Type: application/json' -H 'x-organization-id: release-smoke-synthetic' --data '{"locale":"pt-BR"}')"
          test "$SUPPORT_STATUS" = 401
          echo NESTFINANCE_CONNECT_SUPPORT_AUTHORITY_OK
          if [ "$CONNECT_SUMMARY_API_ONLY" = 'true' ] || [ "$CONNECT_SOURCE_RECOVERY_ONLY" = 'true' ]; then
            gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json > /tmp/finance-after.json
            jq -S '{runtime:(.spec.template.spec | .containers[0] |= (del(.image) | .env = ((.env // []) | map(select(.name != "NESTFINANCE_RELEASE_SHA")) | sort_by(.name)))),serviceLabels:.metadata.labels,templateLabels:.spec.template.metadata.labels,serviceAnnotations:(.metadata.annotations | del(.["run.googleapis.com/operation-id"],.["run.googleapis.com/urls"],.["run.googleapis.com/client-name"],.["run.googleapis.com/client-version"],.["serving.knative.dev/creator"],.["serving.knative.dev/lastModifier"])),templateAnnotations:(.spec.template.metadata.annotations | del(.["client.knative.dev/user-image"],.["run.googleapis.com/client-name"],.["run.googleapis.com/client-version"],.["run.googleapis.com/operation-id"]))}' /tmp/finance-after.json > /tmp/finance-config-after.json
            cmp --silent /tmp/finance-config-before.json /tmp/finance-config-after.json
            gcloud run services get-iam-policy "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json | jq -S . > /tmp/finance-iam-after.json
            cmp --silent /tmp/finance-iam-before.json /tmp/finance-iam-after.json
          fi
          echo "NESTFINANCE_CANONICAL_PRODUCTION_OK=$BASE"

      - name: Restore captured live traffic and Hosting on ANY release failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${PREVIOUS_FINANCE_REVISION:-}" ]; then
            TAG_ARGS=()
            if [ -n "${PREVIOUS_FINANCE_TAG_TARGETS:-}" ]; then TAG_ARGS+=(--update-tags="$PREVIOUS_FINANCE_TAG_TARGETS"); fi
            gcloud run services update-traffic "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --to-revisions="$PREVIOUS_FINANCE_REVISION=100" "${TAG_ARGS[@]}" --quiet
          fi
          if [ "${FINANCE_HOSTING_RELEASE_STARTED:-false}" = true ] && [ -n "${PREVIOUS_FINANCE_HOSTING_VERSION:-}" ]; then
            [[ "$PREVIOUS_FINANCE_HOSTING_VERSION" =~ ^sites/mn-nestfinance-555464791734/versions/[a-zA-Z0-9_-]+$ ]]
            npx firebase-tools@15.27.0 hosting:clone "mn-nestfinance-555464791734@${PREVIOUS_FINANCE_HOSTING_VERSION##*/}" 'mn-nestfinance-555464791734:live' --project "$PROJECT_ID" --non-interactive
          fi
