name: NestFinance Count Free-Form Note Quality

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "api/finance-gateway.ts"
      - "shared/finance/countCapture.ts"
      - "server/vercel-handlers/finance/countCaptureContext.ts"
      - "server/vercel-handlers/finance/countCaptureStorage.ts"
      - "server/vercel-handlers/finance/countFreeFormCapture*.ts"
      - "server/vercel-handlers/finance/countFreeForm*.ts"
      - "server/vercel-handlers/finance/countCapturesDetail.ts"
      - "server/vercel-handlers/finance/countCapturesSaveReview.ts"
      - "server/vercel-handlers/finance/countCapturesApplyToCount.ts"
      - "src/pages/finance/CountPage.tsx"
      - "src/pages/finance/count/CountFreeFormCapturePage.tsx"
      - "src/pages/finance/count/CountCaptureExtractionPanel.tsx"
      - "src/pages/finance/count/CountCaptureReviewPage.tsx"
      - "src/pages/finance/count/CountH2Panels.tsx"
      - "src/services/countCaptureService.ts"
      - "src/app/router/routes.ts"
      - "src/app/router/index.tsx"
      - "scripts/test-count-free-form-note.ts"
      - "scripts/test-count-free-form-note-emulator.ts"
      - "scripts/check-api-contracts.mjs"
      - ".github/workflows/nestfinance-count-free-form-note-quality.yml"

jobs:
  count-free-form:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      FIREBASE_PROJECT_ID: nestfinance-p06b-emulator
      GCLOUD_PROJECT: nestfinance-p06b-emulator

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run lint
      - name: Frontend build
        run: npm run build
      - name: Cloud Run bundle
        run: npm run build:cloudrun
      - name: Certified API contracts
        run: npm run check:api-contracts
      - name: Free-form authority and UX
        run: npx tsx scripts/test-count-free-form-note.ts
      - name: Install emulator tools
        run: npm install firebase-tools@15.27.0 tsx@4.21.0 --no-save
      - name: Free-form Count Firestore Emulator
        run: npx firebase-tools emulators:exec --only firestore --project nestfinance-p06b-emulator "npx tsx scripts/test-count-free-form-note-emulator.ts"
