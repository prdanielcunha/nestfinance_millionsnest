name: Firebase Web Infrastructure Preflight

on:
  pull_request:
    branches: [ main, production ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nestfinance-firebase-web-preflight-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run check:api-contracts
      - run: npm run check:saas-isolation
      - run: npm run test:firebase-infra
      - run: npm run build
      - run: npm run build:cloudrun
