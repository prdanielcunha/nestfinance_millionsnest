name: NestFinance Count Paper-First Simple Quality

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "api/finance-gateway.ts"
      - "server/vercel-handlers/finance/countCapturesApplyToCount.ts"
      - "server/vercel-handlers/finance/countCapturesDetail.ts"
      - "shared/finance/countCaptureApply.ts"
      - "src/pages/finance/CountPage.tsx"
      - "src/pages/finance/count/CountHubPage.tsx"
      - "src/pages/finance/count/CountPaperFormPage.tsx"
      - "src/pages/finance/count/CountCaptureExtractionPanel.tsx"
      - "src/pages/finance/count/CountCaptureReviewPage.tsx"
      - "src/services/countCaptureService.ts"
      - "scripts/test-count-paper-first-simple.ts"
      - "scripts/test-count-paper-first-emulator.ts"
      - "scripts/check-api-contracts.mjs"
      - ".github/workflows/nestfinance-count-paper-first-quality.yml"

jobs:
  count-paper-first:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      FIREBASE_PROJECT_ID: nestfinance-p06b-emulator
      GCLOUD_PROJECT: nestfinance-p06b-emulator

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run lint
      - name: Frontend build
        run: npm run build
      - name: Cloud Run bundle
        run: npm run build:cloudrun
      - name: Certified API contracts
        run: npm run check:api-contracts
      - name: Paper-first authority and senior-friendly UX
        run: npx tsx scripts/test-count-paper-first-simple.ts
      - name: Install emulator tools
        run: npm install firebase-tools@15.27.0 tsx@4.21.0 --no-save
      - name: Paper-first Firestore Emulator
        run: npx firebase-tools emulators:exec --only firestore --project nestfinance-p06b-emulator "npx tsx scripts/test-count-paper-first-emulator.ts"
