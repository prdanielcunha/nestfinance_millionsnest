name: NestFinance Role-Aware Workspace Quality

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/types/access.ts"
      - "src/services/sessionResolutionService.ts"
      - "src/services/directEntryService.ts"
      - "src/lib/permissions.ts"
      - "src/lib/financeExperience.ts"
      - "src/app/layouts/ShellLayout.tsx"
      - "src/app/router/**"
      - "src/app/boundaries/FinanceCapabilityBoundary.tsx"
      - "src/pages/finance/MorePage.tsx"
      - "scripts/test-role-aware-workspace.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/nestfinance-role-workspace-quality.yml"
  push:
    branches: [main]
    paths:
      - "src/types/access.ts"
      - "src/services/sessionResolutionService.ts"
      - "src/services/directEntryService.ts"
      - "src/lib/permissions.ts"
      - "src/lib/financeExperience.ts"
      - "src/app/layouts/ShellLayout.tsx"
      - "src/app/router/**"
      - "src/app/boundaries/FinanceCapabilityBoundary.tsx"
      - "src/pages/finance/MorePage.tsx"
      - "scripts/test-role-aware-workspace.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/nestfinance-role-workspace-quality.yml"

jobs:
  role-workspace-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify role-aware workspace contract
        run: npm run test:role-workspace

      - name: TypeScript lint and typecheck
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Verify public entrypoints
        run: npm run check:vercel-entrypoints
