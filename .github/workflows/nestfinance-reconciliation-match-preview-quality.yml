name: NestFinance Reconciliation Match Preview Quality

on:
  pull_request:
    paths:
      - 'shared/finance/reconciliationMatchPreview.ts'
      - 'shared/finance/reconciliationMatchPreviewApi.ts'
      - 'server/vercel-handlers/finance/reconciliationMatchPreview.ts'
      - 'src/pages/finance/balance/ReconciliationMatchPreviewPanel.tsx'
      - 'src/pages/finance/balance/ReconciliationStatementPreparationPanel.tsx'
      - 'src/services/reconciliationService.ts'
      - 'api/finance-gateway.ts'
      - 'scripts/check-api-contracts.mjs'
      - 'scripts/test-reconciliation-match-preview.ts'
      - 'scripts/test-reconciliation-match-preview-emulator.ts'
      - 'scripts/test-reconciliation-match-preview-ui.ts'
      - '.github/workflows/nestfinance-reconciliation-match-preview-quality.yml'
  push:
    branches:
      - 'architecture/p9c-*'
    paths:
      - 'shared/finance/reconciliationMatchPreview.ts'
      - 'shared/finance/reconciliationMatchPreviewApi.ts'
      - 'server/vercel-handlers/finance/reconciliationMatchPreview.ts'
      - 'src/pages/finance/balance/ReconciliationMatchPreviewPanel.tsx'
      - 'src/pages/finance/balance/ReconciliationStatementPreparationPanel.tsx'
      - 'src/services/reconciliationService.ts'
      - 'api/finance-gateway.ts'
      - 'scripts/check-api-contracts.mjs'
      - 'scripts/test-reconciliation-match-preview.ts'
      - 'scripts/test-reconciliation-match-preview-emulator.ts'
      - 'scripts/test-reconciliation-match-preview-ui.ts'
      - '.github/workflows/nestfinance-reconciliation-match-preview-quality.yml'

jobs:
  reconciliation-match-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_ENV: test
      FIREBASE_PROJECT_ID: nestfinance-reconciliation-match-emulator
      GCLOUD_PROJECT: nestfinance-reconciliation-match-emulator
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run lint

      - name: Frontend build
        run: npm run build

      - name: Cloud Run bundle
        run: npm run build:cloudrun

      - name: Certified API contracts
        run: npm run check:api-contracts

      - name: Deterministic match preview engine
        run: npx tsx scripts/test-reconciliation-match-preview.ts

      - name: Plain-language UX and authority contract
        run: npx tsx scripts/test-reconciliation-match-preview-ui.ts

      - name: Install emulator tools
        run: npm install firebase-tools@15.27.0 tsx@4.21.0 --no-save

      - name: Match preview Firestore Emulator
        run: >
          npx firebase-tools emulators:exec --only firestore
          --project nestfinance-reconciliation-match-emulator
          "npx tsx scripts/test-reconciliation-match-preview-emulator.ts"
