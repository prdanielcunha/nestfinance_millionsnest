name: NestFinance Transaction Saved Views Quality

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "shared/finance/transactionWorkspaceView.ts"
      - "server/vercel-handlers/finance/transactionWorkspaceViewsList.ts"
      - "server/vercel-handlers/finance/transactionWorkspaceViewsSave.ts"
      - "server/vercel-handlers/finance/transactionWorkspaceViewsDelete.ts"
      - "src/services/transactionsService.ts"
      - "src/hooks/finance/useTransactions.ts"
      - "src/components/finance/TransactionSavedViews.tsx"
      - "src/pages/finance/transactions/TransactionsListPage.tsx"
      - "api/finance-gateway.ts"
      - "scripts/check-api-contracts.mjs"
      - "scripts/test-transaction-saved-views.ts"
      - "scripts/test-transaction-saved-views-emulator.ts"
      - "scripts/test-transaction-saved-views-firestore-rules.ts"
      - "firestore.rules"
      - "package.json"
      - ".github/workflows/nestfinance-transaction-saved-views-quality.yml"
      - ".github/workflows/nestfinance-p06b-firestore-emulator.yml"
      - ".github/workflows/nestfinance-production-release.yml"
  push:
    branches: [main]
    paths:
      - "shared/finance/transactionWorkspaceView.ts"
      - "server/vercel-handlers/finance/transactionWorkspaceViewsList.ts"
      - "server/vercel-handlers/finance/transactionWorkspaceViewsSave.ts"
      - "server/vercel-handlers/finance/transactionWorkspaceViewsDelete.ts"
      - "src/services/transactionsService.ts"
      - "src/hooks/finance/useTransactions.ts"
      - "src/components/finance/TransactionSavedViews.tsx"
      - "src/pages/finance/transactions/TransactionsListPage.tsx"
      - "api/finance-gateway.ts"
      - "scripts/check-api-contracts.mjs"
      - "scripts/test-transaction-saved-views.ts"
      - "scripts/test-transaction-saved-views-emulator.ts"
      - "scripts/test-transaction-saved-views-firestore-rules.ts"
      - "firestore.rules"
      - "package.json"
      - ".github/workflows/nestfinance-transaction-saved-views-quality.yml"
      - ".github/workflows/nestfinance-p06b-firestore-emulator.yml"
      - ".github/workflows/nestfinance-production-release.yml"

permissions:
  contents: read

jobs:
  transaction-saved-views-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      FIREBASE_PROJECT_ID: nestfinance-saved-views-emulator
      GCLOUD_PROJECT: nestfinance-saved-views-emulator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify saved views contract
        run: npm run test:transaction-saved-views
      - name: Verify API gateway inventory
        run: npm run check:api-contracts
      - name: TypeScript lint and typecheck
        run: npm run lint
      - name: Frontend build
        run: npm run build
      - name: Cloud Run bundle
        run: npm run build:cloudrun
      - name: Install emulator tools
        run: npm install firebase-tools@15.27.0 tsx@4.21.0 --no-save
      - name: Saved views Firestore Emulator
        run: npx firebase-tools emulators:exec --only firestore --project nestfinance-saved-views-emulator "npx tsx scripts/test-transaction-saved-views-emulator.ts && npx tsx scripts/test-transaction-saved-views-firestore-rules.ts"
