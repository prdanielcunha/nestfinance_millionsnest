name: NestFinance Today 2.0 Quality Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/pages/finance/FinancePage.ts"
      - "src/pages/finance/FinancePage.tsx"
      - "src/pages/finance/TodayActionCenter.tsx"
      - "src/services/transactionsService.ts"
      - "src/app/**"
      - "scripts/test-today-route-resolution.ts"
      - ".github/workflows/nestfinance-today-quality.yml"
  push:
    branches:
      - main
    paths:
      - "src/pages/finance/FinancePage.ts"
      - "src/pages/finance/FinancePage.tsx"
      - "src/pages/finance/TodayActionCenter.tsx"
      - "src/services/transactionsService.ts"
      - "src/app/**"
      - "scripts/test-today-route-resolution.ts"
      - ".github/workflows/nestfinance-today-quality.yml"

jobs:
  today-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify Finance landing resolves to Today 2.0
        run: npx tsx scripts/test-today-route-resolution.ts

      - name: TypeScript lint and typecheck
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Verify public entrypoints
        run: npm run check:vercel-entrypoints
