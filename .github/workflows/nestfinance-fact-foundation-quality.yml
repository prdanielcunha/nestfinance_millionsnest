name: NestFinance Fact Foundation Quality

on:
  push:
    branches:
      - 'architecture/**'
    paths:
      - 'shared/intelligence/**'
      - 'server/vercel-handlers/finance/factStream.ts'
      - 'server/vercel-handlers/finance/countSessionsCreate.ts'
      - 'server/vercel-handlers/finance/universalEvidenceFinalize.ts'
      - 'server/vercel-handlers/finance/transactions*.ts'
      - 'scripts/test-intelligence-fact-foundation.ts'
      - 'scripts/test-transaction-fact-coverage.ts'
      - 'scripts/test-intelligence-facts-firestore-rules.ts'
      - 'firestore.rules'
      - '.github/workflows/nestfinance-fact-foundation-quality.yml'
  pull_request:
    paths:
      - 'shared/intelligence/**'
      - 'server/vercel-handlers/finance/factStream.ts'
      - 'server/vercel-handlers/finance/countSessionsCreate.ts'
      - 'server/vercel-handlers/finance/universalEvidenceFinalize.ts'
      - 'server/vercel-handlers/finance/transactions*.ts'
      - 'scripts/test-intelligence-fact-foundation.ts'
      - 'scripts/test-transaction-fact-coverage.ts'
      - 'scripts/test-intelligence-facts-firestore-rules.ts'
      - 'firestore.rules'
      - '.github/workflows/nestfinance-fact-foundation-quality.yml'

permissions:
  contents: read

jobs:
  fact-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run lint
      - name: Cloud Run bundle
        run: npm run build:cloudrun
      - name: Fact contract checks
        run: |
          npx tsx scripts/test-intelligence-fact-foundation.ts
          npx tsx scripts/test-transaction-fact-coverage.ts
      - name: Canonical fact Firestore rules
        env:
          NODE_ENV: test
          FIREBASE_PROJECT_ID: nestfinance-intelligence-emulator
        run: |
          npm install firebase-tools@15.27.0 --no-save
          npx firebase-tools emulators:exec --only firestore --project nestfinance-intelligence-emulator "npx tsx scripts/test-intelligence-facts-firestore-rules.ts"
