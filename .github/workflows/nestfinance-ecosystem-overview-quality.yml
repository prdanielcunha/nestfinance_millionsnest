name: NestFinance Ecosystem Overview Quality

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "server/vercel-handlers/finance/ecosystemOverview.ts"
      - "server/vercel-handlers/auth/directEntry.ts"
      - "src/components/finance/EcosystemOverviewPanel.tsx"
      - "src/services/ecosystemOverviewService.ts"
      - "src/pages/finance/TodayActionCenter.tsx"
      - "api/finance-gateway.ts"
      - "cloudrunRoutes.ts"
      - "vercel.json"
      - "scripts/test-ecosystem-overview.ts"
      - "scripts/check-api-contracts.mjs"
      - "scripts/test_firebase_hosting_cloudrun_policy.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/nestfinance-ecosystem-overview-quality.yml"
  push:
    branches: [main]
    paths:
      - "server/vercel-handlers/finance/ecosystemOverview.ts"
      - "server/vercel-handlers/auth/directEntry.ts"
      - "src/components/finance/EcosystemOverviewPanel.tsx"
      - "src/services/ecosystemOverviewService.ts"
      - "src/pages/finance/TodayActionCenter.tsx"
      - "api/finance-gateway.ts"
      - "cloudrunRoutes.ts"
      - "vercel.json"
      - "scripts/test-ecosystem-overview.ts"
      - "scripts/check-api-contracts.mjs"
      - "scripts/test_firebase_hosting_cloudrun_policy.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/nestfinance-ecosystem-overview-quality.yml"

jobs:
  ecosystem-overview-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify CEO ecosystem contract
        run: npm run test:ecosystem-overview

      - name: Verify API contracts
        run: npm run check:api-contracts

      - name: Verify hosting and Cloud Run policy
        run: npm run test:firebase-infra

      - name: TypeScript lint and typecheck
        run: npm run lint

      - name: Production build
        run: npm run build
